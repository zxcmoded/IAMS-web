<mat-toolbar class="topbar" color="primary">
  <button matIconButton type="button" (click)="drawer.toggle()" aria-label="Toggle navigation">
    <mat-icon>menu</mat-icon>
  </button>
  <a routerLink="/" class="topbar__brand" aria-label="Tasset.ia home">
    <img src="logo.png" alt="Tasset.ia" class="topbar__logo" />
  </a>
  <span class="topbar__spacer"></span>

  <button matButton type="button" [matMenuTriggerFor]="userMenu" class="topbar__user">
    <mat-icon>account_circle</mat-icon>
    <span class="topbar__user-name">{{ displayName$ | async }}</span>
  </button>
  <mat-menu #userMenu="matMenu">
    <div class="user-menu__header" mat-menu-item disabled>
      <div class="user-menu__name">{{ displayName$ | async }}</div>
      <div class="user-menu__role">{{ roleLabel$ | async }}</div>
    </div>
    <button mat-menu-item type="button" (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Sign out</span>
    </button>
  </mat-menu>
</mat-toolbar>

<mat-sidenav-container class="layout">
  <mat-sidenav #drawer mode="side" opened class="layout__nav">
    <mat-nav-list>
      @for (item of navItems; track item.path) {
        <a
          mat-list-item
          [routerLink]="item.path"
          routerLinkActive
          #rla="routerLinkActive"
          [activated]="rla.isActive"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="layout__content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
